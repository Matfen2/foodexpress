# --- Port dynamique (Render injecte PORT, fallback 8080 en local) ---
server.port=${PORT:8080}

# --- Base de données PostgreSQL ---
spring.datasource.url=jdbc:postgresql://ep-wispy-resonance-agnrqaey.c-2.eu-central-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=neondb_owner
spring.datasource.password=npg_s0krPfIUDq5j

# Pool de connexions (ajusté pour Render Free : 512 Mo RAM)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# --- JPA ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# --- Logging minimal ---
logging.level.root=WARN
logging.level.com.foodexpress=INFO

# --- Flyway en production ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration